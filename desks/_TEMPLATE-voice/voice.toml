# Voice register: _TEMPLATE
#
# [target] is authored: what this register writes for, and the cadence thresholds that
# suit it. [measured] is written by the linter from this register's own corpus, because
# contraction density and comma rate are one writer's fingerprint, not a virtue. An
# absolute threshold would push every writer toward the same middle, which is the exact
# failure the voice layer exists to fix.

[target]
# typed and spoken are different voices. Point this at the one this desk writes in.
corpus = "corpus/typed"
# The medium assumed when a draft's front matter does not declare one.
medium = "post"
# Verify these against the live platform before trusting them; published limits drift.
post_chars = 280
thread_max_posts = 8
# Cadence, in words. Tune to this register, not to a style guide.
short_sentence_words = 9
long_sentence_words = 22
# Under this word count a draft is too short for the comma-splice test to mean anything.
splice_floor_words = 120

[measured]
# GENERATED by: scripts/check-voice.py --measure desks/_TEMPLATE --write
# Do not hand-edit. A stale corpus is re-pulled, never cleaned up.
source = "corpus/typed"
samples = 0
words = 0
